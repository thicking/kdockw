name: Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "branding/**"
      - "docs/screenshots/**"
      - "scripts/check_website.py"
      - ".gitattributes"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true

      - name: Configure Pages
        uses: actions/configure-pages@v6
        # Pages must be enabled once in repository settings with an admin
        # token; GITHUB_TOKEN cannot create the site. This workflow only reads
        # the existing configuration and deploys the explicitly assembled site.
        with:
          enablement: false

      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/css _site/screenshots
          cp website/index.html website/404.html website/favicon.ico website/favicon.svg \
            website/favicon-32.png website/apple-touch-icon.png website/maskable-512.png \
            website/icon-192.png website/icon-512.png website/site.webmanifest \
            website/robots.txt website/sitemap.xml website/og-image.png _site/
          cp website/css/site.css _site/css/site.css
          cp docs/screenshots/kdockw-classic-zoom.png \
            docs/screenshots/kdockw-window-preview.png \
            docs/screenshots/kdockw-dock-overview.png \
            docs/screenshots/kdockw-demo.mp4 _site/screenshots/

          if [[ ! -f _site/og-image.png ]]; then
            echo "::error file=website/index.html::website/og-image.png is missing but referenced by og:image"
            exit 1
          fi

          find _site -type f | sort

      - name: Check assembled site and media
        run: python3 scripts/check_website.py _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
