# KDockW Positioning Manifest
# Single source of truth for product positioning, keywords, and search intents.
# All documentation and SEO files derive from this manifest.
# Increment manifest_version when making deliberate positioning changes.

manifest_version: "1.3.0"

product:
  name: KDockW
  tagline: "A customizable dock for KDE Plasma 6 on Wayland"
  one_liner: "A customizable KDE Plasma 6 dock for Wayland with parabolic zoom and live window previews — a spiritual successor to Latte Dock."
  meta_description: "KDockW is a customizable KDE Plasma 6 dock for Wayland with parabolic zoom, live previews of open and minimized windows, and macOS-style interactions."
  elevator_pitch: >-
    KDockW is an independently developed KDE Plasma 6 dock for Wayland and a
    spiritual successor to Latte Dock. Based on Krema, it offers parabolic zoom,
    live previews of open and minimized windows, app grouping, and integration
    with the Plasma desktop through Qt and KDE Frameworks.
  latte_dock_relation: "spiritual successor"  # ONLY this phrase — never "replacement", "fork", or "clone"
  language: C++23
  frameworks:
    - Qt 6
    - KDE Frameworks 6
    - Kirigami
  background_style_count: 4
  attention_animation_count: 6
  visibility_mode_count: 3

keywords:
  primary:
    - kde plasma dock
    - latte dock alternative
    - kde plasma 6 dock
    - plasma 6 dock
    - kde dock wayland

  secondary:
    - wayland dock linux
    - kde dock application
    - linux dock app
    - kde taskbar alternative
    - macos dock linux
    - parabolic zoom dock
    - pipewire window preview

  long_tail:
    - latte dock plasma 6 alternative
    - best dock for kde plasma
    - lightweight dock kde plasma
    - parabolic zoom dock linux
    - pipewire window preview dock
    - kde plasma dock with window previews
    - wayland native dock kde

  metainfo_keywords:
    - dock
    - launcher
    - taskbar
    - panel
    - latte
    - kde
    - plasma
    - wayland
    - zoom
    - preview

  github_topics:
    - kde
    - kde-plasma
    - plasma6
    - wayland
    - dock
    - linux-desktop
    - qt6
    - kirigami
    - macos-style
    - latte-dock
    - kwin

search_intents:
  - name: latte-dock-migration
    description: "Former Latte Dock users seeking a dock for KDE Plasma 6"
    keywords: [latte dock alternative, latte dock plasma 6 alternative]

  - name: kde-dock-search
    description: "KDE users looking for a dock application"
    keywords: [kde plasma dock, kde plasma 6 dock, kde dock application]

  - name: wayland-dock
    description: "Users specifically seeking Wayland-native dock"
    keywords: [wayland dock linux, kde dock wayland, wayland native dock kde]

  - name: customization
    description: "Linux customizers (r/unixporn) seeking aesthetic dock"
    keywords: [parabolic zoom dock, linux dock app, macos dock linux]

  - name: window-preview
    description: "Users wanting dock with window preview feature"
    keywords: [pipewire window preview, kde plasma dock with window previews]

  - name: lightweight-dock
    description: "Users seeking performant, lightweight dock"
    keywords: [lightweight dock kde plasma, best dock for kde plasma]

brand:
  website: "https://thicking.github.io/kdockw/"
  github_description: "KDockW — A modern, customizable dock for KDE Plasma 6 on Wayland, featuring parabolic zoom, live window previews, and macOS-style interactions."
  guide: branding/README.md
  icon_concept: "Blue-to-violet rounded square with a dark K glyph and a small dock motif"
  wordmark_concept: "KDockW wordmark set beside the blue-violet application mark in existing website artwork"
  palette:
    background: "#0e1630"
    surface: "#17264e"
    text: "#f3f7ff"
    muted: "#b8c5e6"
    blue: "#68a8ff"
    cyan: "#8ce7f5"
    violet: "#b7a1ff"
  assets:
    icon: branding/logo/kdockw-icon-source.png
    app_icon_exports: branding/logo/kdockw-app-icons/
    README_lockup: branding/logo/kdockw-logo.png
    social_preview: website/og-image.png
    generator: branding/logo/export-app-icons.sh

target_audience:
  primary: "Former Latte Dock users who lost their dock when upgrading to KDE Plasma 6"
  secondary:
    - "KDE Plasma users who want a more feature-rich dock than the default panel"
    - "Linux customizers (r/unixporn) seeking aesthetic desktop setups"
    - "macOS converts looking for familiar dock behavior on Linux"

value_propositions:
  - audience: "Former Latte Dock users"
    headline: "Your dock is back."
    points:
      - "Picks up where Latte Dock left off, purpose-built for Plasma 6"
      - "Familiar parabolic zoom, drag-and-drop, smart visibility modes"
      - "Kirigami-based settings dialog"
  - audience: "KDE Plasma enthusiasts"
    headline: "A dock that speaks Plasma."
    points:
      - "Uses KDE's own frameworks: Kirigami, KConfig, KColorScheme, KGlobalAccel"
      - "Respects Plasma theme colors, global shortcuts, and desktop conventions"
      - "Window previews powered by PipeWire, the same stack Plasma uses"
  - audience: "Performance-conscious users"
    headline: "Lightweight by design."
    points:
      - "GPU-accelerated rendering via QRhi (Vulkan/OpenGL)"
      - "Wayland-native via Layer Shell, no X11 compatibility hacks"
      - "Lazy resource allocation; GPU resources released when the dock is hidden"
  - audience: "Customizers (r/unixporn)"
    headline: "Make it yours."
    points:
      - "4 background styles: panel inherit, transparent, tinted, acrylic frosted glass"
      - "Configurable icon size, zoom, spacing, and dock position"
      - "Icon size normalization for uniform icons across themes"
  - audience: "Accessibility-minded users"
    headline: "A dock for everyone."
    points:
      - "Full keyboard navigation (Meta+Alt+D to focus, arrow keys, Enter/Escape)"
      - "AT-SPI screen reader support with accessible names and announcements"
      - "Visual focus ring following KDE accessibility guidelines"

competitors:
  - name: Latte Dock
    status: "Discontinued; no Plasma 6 support"
  - name: Plank
    status: "GTK-based, no Wayland support"
  - name: KDE default panel
    status: "Plasma 6 and Wayland, but no parabolic zoom"

differentiators:
  - "Only actively maintained dock with parabolic zoom for Plasma 6"
  - "Wayland-native from day one — no X11 legacy code"
  - "Deep KDE integration — built WITH KDE libraries, not just running on KDE"
  - "PipeWire-based window previews — modern, efficient, Plasma-native"
  - "4 background styles including acrylic frosted glass"
  - "Full keyboard accessibility with AT-SPI screen reader support"

tone:
  - "Enthusiastic but not hype-y — let features speak for themselves"
  - "Technical credibility — name specific technologies (PipeWire, Layer Shell, QRhi)"
  - "Community-first — open source, contributions welcome, built for the KDE community"
  - "Respectful of Latte Dock — 'spiritual successor', not 'replacement'"

drift_detection:
  metainfo_keyword_max_divergence: 2
  github_topic_max_divergence: 3
  files_to_audit:
    - README.md
    - CHANGELOG.md
    - src/com.thicking.kdockw.metainfo.xml
    - src/com.thicking.kdockw.desktop.in
    - packaging/arch/PKGBUILD
    - marketing/strategy.md
